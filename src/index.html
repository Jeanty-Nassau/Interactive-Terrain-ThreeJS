<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Displacement Field — an interactive radar-like signal terrain with pointer and click-driven pulses.">
  <title>Displacement Field — Interactive Signal Terrain</title>
</head>
<body>
  <main class="study-shell">
    <section class="study-copy">
      <p class="eyebrow">THREE.JS STUDY / 03</p>
      <h1>Displacement <span>Field</span></h1>
      <p>A radar-like signal terrain built from animated displacement, contour bands, scan energy, and direct pointer input.</p>
      <p class="hint">Move to bend the field · Click to send a pulse.</p>
    </section>

    <div id="canvasContainer">
      <canvas class="webgl" aria-label="Interactive signal terrain"></canvas>
    </div>

    <aside class="controls-panel">
      <strong>Interaction</strong>
      <span>pointer / click</span>
      <button type="button" data-reset-field>Pulse centre</button>
    </aside>
  </main>
</body>
</html>
